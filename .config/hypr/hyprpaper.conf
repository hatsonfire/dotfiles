# ===================================================================
# HYPRPAPER - Basic Configuration
# ===================================================================
# This preloads the specified wallpaper into memory for fast switching.
preload = /usr/share/backgrounds/archlinux/archwave.png

# This sets the wallpaper for all monitors.
# The comma at the beginning means "apply to the current/all monitors".
wallpaper = ,usr/share/backgrounds/archlinux/archwave.png
