# ===================================================
# FUZZEL - Basic Configuration
# ===================================================
# This file uses the INI format to configure Fuzzel's
# appearance and behavior.
#
# Colors are specified in RGBA hex format (RRGGBBAA).
# ===================================================

[main]
# Set the font. Using a Nerd Font is recommended for icons.
font=FiraCode Nerd Font:size=12

# Enable DPI awareness and set the scaling factor.
# scale=2 corresponds to 200%.
dpi-aware=yes
scale=2
image-size-ratio=0

# You can specify which terminal to use for terminal applications.
terminal=kitty

# Set the position of the launcher on the screen.
layer=top

# Allow launcher to be screenshotted
#exit-on-keyboard-focus-loss=no

[colors]
# A dark background color (Nord theme).
background=2E3440FF
# Light text color for contrast.
text=ECEFF4FF
# Color for the text that matches your search.
match=88C0D0FF
# Background color for the currently selected line.
selection=4C566AFF
# Text color for the currently selected line.
selection-text=ECEFF4FF
# Color for the matching text on the selected line.
selection-match=8FBCBBFF

[border]
width=2
radius=12
color=5E81ACFF

